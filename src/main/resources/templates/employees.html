<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Nhân viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="text-center mb-4">📋 Danh sách Nhân viên</h2>

    <!-- Thanh công cụ: Tìm kiếm + Thêm mới -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <form th:action="@{/employees}" method="get" class="d-flex flex-wrap align-items-center gap-2">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên nhân viên..." class="form-control"
                   style="max-width:240px;"/>
            <select name="departmentId" class="form-select" style="max-width:220px;">
                <option value="">-- Chọn phòng ban --</option>
                <option th:each="dept : ${departments}"
                        th:value="${dept.id}"
                        th:text="${dept.name}"
                        th:selected="${departmentId != null and departmentId == dept.id}"></option>
            </select>
            <input type="number" name="minAge" min="0" th:value="${minAge}" placeholder="Tuổi từ" class="form-control"
                   style="max-width:120px;"/>
            <input type="number" name="maxAge" min="0" th:value="${maxAge}" placeholder="Đến" class="form-control"
                   style="max-width:100px;"/>
            <input type="hidden" name="sortField" th:value="${sortField}"/>
            <input type="hidden" name="sortDir" th:value="${sortDir}"/>
            <button type="submit" class="btn btn-primary">🔍 Tìm</button>
            <a th:if="${(keyword != null and !keyword.isEmpty()) or departmentId != null or minAge != null or maxAge != null}"
               th:href="@{/employees(sortField=${sortField}, sortDir=${sortDir})}"
               class="btn btn-outline-secondary">✕ Xóa</a>
        </form>
        <div class="d-flex gap-2">
            <a th:href="@{/employees/add}" class="btn btn-success">➕ Thêm nhân viên mới</a>
            <a th:href="@{/departments}" class="btn btn-info text-white">🏢 Quản lý phòng ban</a>
        </div>
    </div>

    <!-- Thông tin tổng -->
    <div class="text-muted mb-2">
        <span>Tổng: <strong th:text="${totalItems}">0</strong> nhân viên</span>
        <span class="ms-3">Sắp xếp theo:
            <strong th:text="${sortField == 'name' ? 'Tên' : 'Tuổi'}"></strong>
            (<span th:text="${sortDir == 'asc' ? 'Tăng dần ↑' : 'Giảm dần ↓'}"></span>)
        </span>
    </div>

    <!-- Bảng dữ liệu -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Ảnh</th>
                <th>
                    <a class="text-decoration-none"
                       th:href="@{/employees(page=${currentPage}, size=5, sortField='name', sortDir=${reverseSortDir}, keyword=${keyword}, departmentId=${departmentId}, minAge=${minAge}, maxAge=${maxAge})}">
                        Họ tên <span class="small" th:if="${sortField == 'name'}"
                                     th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span>
                    </a>
                </th>
                <th>
                    <a class="text-decoration-none"
                       th:href="@{/employees(page=${currentPage}, size=5, sortField='age', sortDir=${reverseSortDir}, keyword=${keyword}, departmentId=${departmentId}, minAge=${minAge}, maxAge=${maxAge})}">
                        Tuổi <span class="small" th:if="${sortField == 'age'}"
                                     th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span>
                    </a>
                </th>
                <th>Avatar file</th>
                <th>Trạng thái</th>
                <th>Phòng ban</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td>
                    <img th:src="${emp.avatar != null ? '/uploads/' + emp.avatar : 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23ddd%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 font-size=%2240%22 fill=%22%23999%22%3E%F0%9F%91%A4%3C/text%3E%3C/svg%3E'}"
                         class="rounded-circle" style="width:50px; height:50px; object-fit:cover;" alt="avatar"/>
                </td>
                <td th:text="${emp.name}"></td>
                <td th:text="${emp.age}"></td>
                <td th:text="${emp.avatar}"></td>
                <td th:text="${emp.status}"></td>
                <td th:text="${emp.department?.name}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Thông báo không tìm thấy kết quả -->
    <div class="alert alert-light text-center" th:if="${#lists.isEmpty(employees)}">
        😟 Không tìm thấy nhân viên nào
        <span th:if="${keyword != null and !keyword.isEmpty()}"> với từ khóa "<strong th:text="${keyword}"></strong>"</span>.
    </div>

    <!-- Thanh phân trang -->
    <nav th:if="${totalPages > 0}">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/employees(page=${currentPage - 1}, size=5, sortField=${sortField}, sortDir=${sortDir}, keyword=${keyword}, departmentId=${departmentId}, minAge=${minAge}, maxAge=${maxAge})}">◀ Trang trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/employees(page=${i}, size=5, sortField=${sortField}, sortDir=${sortDir}, keyword=${keyword}, departmentId=${departmentId}, minAge=${minAge}, maxAge=${maxAge})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/employees(page=${currentPage + 1}, size=5, sortField=${sortField}, sortDir=${sortDir}, keyword=${keyword}, departmentId=${departmentId}, minAge=${minAge}, maxAge=${maxAge})}">Trang sau ▶</a>
            </li>
        </ul>
    </nav>

    <div class="text-center text-muted" th:if="${totalPages > 0}">
        Trang <strong th:text="${currentPage + 1}"></strong> / <strong th:text="${totalPages}"></strong>
    </div>
</div>

</body>
</html>
