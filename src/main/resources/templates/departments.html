<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Phòng ban</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="text-center mb-4">🏢 Quản lý Phòng ban</h2>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a class="btn btn-outline-secondary" th:href="@{/employees}">← Quay lại danh sách nhân viên</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Tên phòng</th>
                <th>Địa điểm</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dept : ${departments}">
                <td th:text="${dept.id}"></td>
                <td th:text="${dept.name}"></td>
                <td th:text="${dept.location}"></td>
                <td>
                    <form th:action="@{/departments/{id}/delete(id=${dept.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Xóa phòng ban này?');">Xóa</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
