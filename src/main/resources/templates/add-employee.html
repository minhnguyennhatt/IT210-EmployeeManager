<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thêm nhân viên</title>
  <style>
    form { width: 400px; margin: 20px auto; }
    div { margin-bottom: 10px; }
    label { display: inline-block; width: 120px; }
    .error { color: red; }
  </style>
</head>
<body>
<h2>Thêm nhân viên mới</h2>
<!-- enctype="multipart/form-data" bắt buộc để upload file -->
<form th:action="@{/employees/add}" th:object="${employee}" method="post" enctype="multipart/form-data">
  <div>
    <label for="name">Họ tên:</label>
    <input type="text" id="name" th:field="*{name}" required/>
  </div>
  <div>
    <label for="age">Tuổi:</label>
    <input type="number" id="age" th:field="*{age}" required/>
  </div>
  <div>
    <label for="status">Trạng thái:</label>
    <select id="status" th:field="*{status}">
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>
  </div>
  <div>
    <label for="department">Phòng ban:</label>
    <!-- Binding id của department.combobox -->
    <select id="department" th:field="*{department.id}">
      <option value="">-- Chọn phòng ban --</option>
      <option th:each="dept : ${departments}"
              th:value="${dept.id}"
              th:text="${dept.name}"></option>
    </select>
  </div>
  <div>
    <label for="file">Ảnh đại diện:</label>
    <input type="file" id="file" name="file" accept="image/*"/>
  </div>
  <div>
    <button type="submit">Lưu nhân viên</button>
    <a th:href="@{/employees}">Hủy</a>
  </div>
</form>
</body>
</html>
