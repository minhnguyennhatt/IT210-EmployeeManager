<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thêm nhân viên</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <h2 class="text-center mb-4">Thêm nhân viên mới</h2>
  <!-- enctype="multipart/form-data" bắt buộc để upload file -->
  <form th:action="@{/employees/add}" th:object="${employee}" method="post" enctype="multipart/form-data" class="card p-4 shadow-sm mx-auto" style="max-width:520px;">
    <div class="mb-3">
      <label for="name" class="form-label">Họ tên:</label>
      <input type="text" id="name" th:field="*{name}" required class="form-control"/>
    </div>
    <div class="mb-3">
      <label for="age" class="form-label">Tuổi:</label>
      <input type="number" id="age" th:field="*{age}" required class="form-control"/>
    </div>
    <div class="mb-3">
      <label for="status" class="form-label">Trạng thái:</label>
      <select id="status" th:field="*{status}" class="form-select">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="department" class="form-label">Phòng ban:</label>
      <!-- Binding id của department.combobox -->
      <select id="department" th:field="*{department.id}" class="form-select">
        <option value="">-- Chọn phòng ban --</option>
        <option th:each="dept : ${departments}"
                th:value="${dept.id}"
                th:text="${dept.name}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label for="file" class="form-label">Ảnh đại diện:</label>
      <input type="file" id="file" name="file" accept="image/*" class="form-control"/>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Lưu nhân viên</button>
      <a th:href="@{/employees}" class="btn btn-outline-secondary">Hủy</a>
    </div>
  </form>
</div>
</body>
</html>
