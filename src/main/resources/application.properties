spring.application.name=employee-manager

spring.datasource.url=jdbc:mysql://localhost:3306/employee-manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

# File upload configuration
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# I18N
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=0